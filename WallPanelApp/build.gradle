// Disable lint tasks when building on JDK 25+ (lint worker fails with "25.0.2" javacOptions bug)
if (JavaVersion.current() >= JavaVersion.VERSION_25) {
    tasks.configureEach { t -> if (t.name.startsWith('lint')) t.enabled = false }
}
