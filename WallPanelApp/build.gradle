plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-parcelize'
    id 'kotlin-kapt' // Allows for Kotlin annotation processors
    //id 'androidx.navigation.safeargs.kotlin'
    id 'dagger.hilt.android.plugin'
}

def versionMajor = 0
def versionMinor = 12
def versionPatch = 0
def versionBuild = 0 // bump for dog food builds, public betas, etc.

def safeLocalProperty(String key, String defaultValue) {
    def file = project.rootProject.file('local.properties')
    if (!file.exists()) return defaultValue
    def properties = new Properties()
    try {
        properties.load(file.newDataInputStream())
        def value = properties.getProperty(key)
        return value != null ? value : defaultValue
    } catch (Exception ignored) {
        return defaultValue
    }
}

def CODE() { return safeLocalProperty("code", "1234") }
def HASS_URL() { return safeLocalProperty("hassUrl", "") }
def BROKER() { return safeLocalProperty("broker", "") }
def BROKER_PASS() { return safeLocalProperty("brokerPass", "") }
def BROKER_USERNAME() { return safeLocalProperty("brokerUsername", "") }

// Use JDK 17 for compilation so kapt/Kotlin work when running Gradle on JDK 25
kotlin {
    jvmToolchain(17)
}

android {
    kapt {
        correctErrorTypes = true
        javacOptions {
            option("--release", "17")
        }
        // Hilt's Gradle plugin normally injects these via AGP's new Variant API,
        // which android.newDsl=false (needed for kapt under AGP 9) disables — so
        // the flags never reach the classic kotlin-kapt task. Passed by hand.
        arguments {
            arg("dagger.hilt.android.internal.disableAndroidSuperclassValidation", "true")
            arg("dagger.hilt.android.internal.projectType", "APP")
        }
    }
    compileSdk 35
    lint {
        // Gate release builds on lintVital, which only checks Fatal-severity issues
        // (broken manifests, missing resources, invalid references) by design — not the
        // hundreds of pre-existing deprecation warnings we're deliberately not fixing yet.
        abortOnError = true
        checkReleaseBuilds = true
    }
    defaultConfig {
        applicationId "xyz.wallpanel.app"
        minSdkVersion 26
        targetSdk 34
        versionCode versionMajor * 10000 + versionMinor * 1000 + versionPatch * 100 + versionBuild + 7
        versionName "${versionMajor}.${versionMinor}.${versionPatch}.${versionBuild}"
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    splits {
        abi {
            reset()
            enable true
            universalApk true
            include "armeabi-v7a", "x86", "arm64-v8a", "x86_64"
        }
    }
    buildTypes {
        debug {
            // Distinct from both installed apps (xyz.wallpanel.app, xyz.wallpanel.app.kmb)
            // so debug/test builds never touch the production panel or the rollback build.
            applicationIdSuffix ".dev"
        }
        release {
            minifyEnabled false
            shrinkResources false
            // AGP 9.3.2 rejects 'proguard-android.txt' at evaluation time (it bakes in
            // -dontoptimize, which AGP 9 no longer allows via getDefaultProguardFile).
            // Forced by the AGP bump, not a minification-behavior choice — inert today
            // since minifyEnabled is false above.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }

    flavorDimensions "default"

    productFlavors {
        def BASE_ENVIRONMENT = "BASE_ENVIRONMENT"
        dev {
            dimension "default"
            buildConfigField "String", BASE_ENVIRONMENT, '"DEV_ENVIRONMENT"'
            applicationId "xyz.wallpanel.app"
            versionName "${versionMajor}.${versionMinor}.${versionPatch} Build ${versionBuild}-DEV"
            buildConfigField 'Integer', 'CODE', CODE()
            buildConfigField 'String', 'HASS_URL', "\"" + HASS_URL().replace('"', '\\"') + "\""
            buildConfigField 'String', 'BROKER', "\"" + BROKER().replace('"', '\\"') + "\""
            buildConfigField 'String', 'BROKER_PASS', "\"" + BROKER_PASS().replace('"', '\\"') + "\""
            buildConfigField 'String', 'BROKER_USERNAME', "\"" + BROKER_USERNAME().replace('"', '\\"') + "\""
        }
        qa {
            dimension "default"
            buildConfigField "String", BASE_ENVIRONMENT, '"QA_ENVIRONMENT"'
            applicationId "xyz.wallpanel.app"
            versionName "${versionMajor}.${versionMinor}.${versionPatch} Build ${versionBuild}-QA"
            buildConfigField 'Integer', 'CODE', '1234'
            buildConfigField 'String', 'HASS_URL', '""'
            buildConfigField 'String', 'BROKER', '""'
            buildConfigField 'String', 'BROKER_USERNAME', '""'
            buildConfigField 'String', 'BROKER_PASS', '""'
        }
        prod {
            dimension "default"
            buildConfigField "String", BASE_ENVIRONMENT, '"PROD_ENVIRONMENT"'
            applicationId "xyz.wallpanel.app"
            applicationIdSuffix ".kmb"
            versionName "${versionMajor}.${versionMinor}.${versionPatch} Build ${versionBuild}-kmb.8"
            buildConfigField 'Integer', 'CODE', '1234'
            buildConfigField 'String', 'HASS_URL', '""'
            buildConfigField 'String', 'BROKER', '""'
            buildConfigField 'String', 'BROKER_USERNAME', '""'
            buildConfigField 'String', 'BROKER_PASS', '""'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    packaging {
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties']
        }
    }
    namespace 'xyz.wallpanel.app'
}

dependencies {

    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.vectordrawable:vectordrawable:1.2.0'
    // Vision API deprecated; ML Kit is the replacement (migration in progress)
    implementation 'com.google.android.gms:play-services-vision:20.1.3'
    implementation 'com.google.mlkit:barcode-scanning:17.2.0'
    implementation 'com.google.mlkit:face-detection:16.1.6'

    // Navigation
    implementation 'androidx.navigation:navigation-fragment-ktx:2.10.0'
    implementation 'androidx.navigation:navigation-ui-ktx:2.10.0'

    // RxJava
    implementation 'io.reactivex.rxjava2:rxjava:2.2.19'
    implementation 'io.reactivex.rxjava2:rxandroid:2.0.1'

    // LiveData + ViewModel (lifecycle-extensions is deprecated; use specific artifacts)
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$versions.lifecycle"
    implementation "androidx.lifecycle:lifecycle-service:$versions.lifecycle"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$versions.lifecycle"
    implementation "androidx.lifecycle:lifecycle-reactivestreams-ktx:$versions.lifecycle"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$versions.lifecycle"

    // Retrofit
    implementation "com.squareup.retrofit2:retrofit:$versions.retrofit"
    implementation "com.squareup.retrofit2:converter-gson:$versions.retrofit"
    implementation "com.squareup.retrofit2:adapter-rxjava2:$versions.retrofit"

    // OKHttp
    implementation 'com.squareup.okhttp3:logging-interceptor:3.4.1'
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'

    // Hilt (ships in lockstep with Dagger; paired at the same version).
    // The Gradle plugin auto-wires the kapt dependency, but only recognizes the
    // current "hilt-compiler" artifact name, not the older "hilt-android-compiler" -
    // declaring the latter left @AndroidEntryPoint's value permanently unfilled.
    implementation "com.google.dagger:hilt-android:$versions.dagger"
    kapt "com.google.dagger:hilt-compiler:$versions.dagger"

    // MQTT
    implementation 'com.hivemq:hivemq-mqtt-client:1.3.2'
    implementation 'com.koushikdutta.async:androidasync:2.1.9'
    implementation 'net.sourceforge.streamsupport:android-retrostreams:1.7.4'
    implementation 'net.sourceforge.streamsupport:android-retrofuture:1.7.4'

    // Logging
    implementation 'com.jakewharton.timber:timber:4.7.1'

    // Glide for image loading (Picasso removed; use Glide only)
    implementation 'com.github.bumptech.glide:glide:4.12.0'
    // No @GlideModule/AppGlideModule in this codebase; compiler generates nothing, dropped

    // Unit tests
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestUtil 'androidx.test:orchestrator:1.6.1'

}

