// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        gradlePluginPortal()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.0'
        classpath "com.google.dagger:hilt-android-gradle-plugin:2.60.1"
        // KSP 2.3.x is off the old Kotlin-locked "<kotlin>-<ksp>" versioning line and
        // versions independently of the Kotlin compiler. Required at 2.3.x+: every
        // 2.2.21-* release hard-throws on AGP built-in Kotlin, while 2.3.x gates that
        // refusal on AGP < 9.0.0-alpha14 only. There is no kotlin-gradle-plugin classpath
        // entry any more — the Kotlin compiler now comes from AGP's built-in Kotlin, so
        // its version tracks the AGP version rather than a pin here.
        //
        // CONSEQUENCE: bumping AGP now also bumps the Kotlin compiler, underneath a KSP
        // pin that no longer moves with it. Nothing fails at configuration time if they
        // drift apart. Re-check KSP compatibility on every AGP bump.
        classpath "com.google.devtools.ksp:symbol-processing-gradle-plugin:2.3.11"
    }
}

allprojects {
    repositories {
        google()
        gradlePluginPortal()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

ext.deps = [:]
def versions = [:]
versions.lifecycle = "2.11.0"
versions.support = "28.0.0"
versions.navigation = "1.0.0"
versions.constraint_layout = "1.1.0"
versions.stetho = "1.3.1"
versions.dagger = "2.60.1"
versions.archVersion = '1.1.1'
versions.archRoomVersion = '1.1.0'
ext.versions = versions